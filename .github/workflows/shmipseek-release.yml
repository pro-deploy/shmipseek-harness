name: ShmipSeek release

# Unsigned Desktop installers for macOS arm64 and x64, Windows x64, and Linux x64, built on GitHub-hosted runners.
# A pushed tag v<product version>.<YYYYMMDD>.<index> publishes a GitHub Release only after all four targets build and
# pass the packaged-application smoke checks. A manual run builds the same installers as run artifacts without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shmipseek-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      # Rejects a tag that does not extend the product version or that already has a release, before any build starts.
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          product=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then echo "version=" >> "$GITHUB_OUTPUT"; exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^${product//./\\.}\.[0-9]{8}\.[1-9][0-9]*$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must be v$product.<YYYYMMDD>.<index>"; exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists; push a new tag instead of rebuilding a published version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            script: package:desktop:mac:arm64:unsigned
          - target: mac-x64
            runner: macos-15-intel
            script: package:desktop:mac:x64:unsigned
          - target: win-x64
            runner: windows-latest
            script: package:desktop:win:x64:unsigned
          - target: linux-x64
            runner: ubuntu-24.04
            script: package:desktop:linux:x64:unsigned
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: '1'
      BUILD_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Select package cache
        run: echo "DSH_DESKTOP_PACKAGE_CACHE_DIR=${RUNNER_TEMP}/dsh-desktop-package-cache" >> "$GITHUB_ENV"
      # Downloaded Electron and runtime archives plus the runtime pnpm store; integrity is verified on reuse.
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ env.DSH_DESKTOP_PACKAGE_CACHE_DIR }}
          key: dsh-desktop-package-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json') }}
          restore-keys: dsh-desktop-package-${{ matrix.target }}-
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Write unsigned Windows settings
        if: matrix.target == 'win-x64'
        run: |
          printf '%s\n' \
            'DSH_DESKTOP_APP_ID=com.deepseek.harness' \
            'DSH_DESKTOP_AUTO_UPDATE_ENV=test' \
            'DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=7' > apps/desktop/.env.windows
      - name: Build and verify installer
        if: matrix.target != 'win-x64'
        run: |
          args=()
          if [[ -n "$BUILD_VERSION" ]]; then args=(-- --build-version "$BUILD_VERSION"); fi
          pnpm run ${{ matrix.script }} "${args[@]}"
      # PowerShell resolves tar to Windows bsdtar; Git's GNU tar in the bash PATH reads D:\ paths as remote hosts.
      - name: Build and verify installer (Windows)
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          $extra = @()
          if ($env:BUILD_VERSION) { $extra = @('--', '--build-version', $env:BUILD_VERSION) }
          pnpm run ${{ matrix.script }} @extra
      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: installer-${{ matrix.target }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.dmg
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.AppImage
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.deb
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaging-logs-${{ matrix.target }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish release
    # Runs only when preflight and all four package jobs succeed, so a release always carries every installer.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true
      - name: Write checksums and release notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          (cd installers && sha256sum -- * > SHA256SUMS)
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "Неподписанные установщики ShmipSeek Harness Desktop $VERSION, собранные из коммита $GITHUB_SHA."
            echo
            echo "## Установка"
            echo
            echo "- macOS: откройте .dmg (arm64 для Apple Silicon, x64 для Intel), перенесите приложение в «Программы» и при первом запуске откройте его через контекстное меню, пункт «Открыть»."
            echo "- Windows: запустите .exe; в предупреждении SmartScreen нажмите «Подробнее», затем «Выполнить в любом случае»."
            echo "- Linux: сделайте .AppImage исполняемым и запустите его либо установите .deb командой apt."
            echo "- Контрольные суммы SHA-256 всех файлов перечислены в SHA256SUMS."
            echo
            echo "## Изменения"
            echo
            if [[ -n "$previous" ]]; then
              git log --no-merges --format='- %s (%h)' "$previous..$GITHUB_REF_NAME"
            else
              git log --no-merges --format='- %s (%h)' -n 30 "$GITHUB_REF_NAME"
            fi
          } > release-notes.md
          ls -l installers
      # A draft receives every asset first, so the published release never appears with a partial file list.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "ShmipSeek Harness $GITHUB_REF_NAME" --notes-file release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
